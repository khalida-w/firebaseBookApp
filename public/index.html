<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amiibo Lab Exam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <style>
        body { background: #f5f5f5; }
        .amiibo-card { padding: 10px; text-align: center; border: 1px solid #ddd; border-radius: 8px; background: white; }
        .amiibo-card img { width: 100px; }
        #amiibo-container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 20px; }
        .review-section { margin-top: 40px; padding: 20px; background: white; border-radius: 8px; }
    </style>
</head>
<body>

    <nav class="red darken-2">
        <div class="nav-wrapper container">
            <a href="#" class="brand-logo">AmiiboDB</a>
            <ul id="nav-mobile" class="right">
                <li><span id="user"></span></li>
                <li><button id="loginBtn" class="btn blue">Login</button></li>
                <li><button id="logoutBtn" class="btn grey" style="display:none;">Logout</button></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="search-box" style="margin: 20px 0;">
            <input type="text" id="character-input" placeholder="Search Amiibo (e.g. Zelda)">
            <button id="search-btn" class="btn red">Search</button>
        </div>

        <div id="amiibo-container"></div>

        <div class="review-section">
            <h5 id="selectedName">Select an Amiibo to Review</h5>
            <ul id="reviewList" class="collection"></ul>

            <form id="reviewForm">
                <input type="hidden" id="selectedBook" name="isbn" value="">
                <div class="input-field">
                    <input type="text" name="text" id="reviewText" required>
                    <label for="reviewText">Enter Review</label>
                </div>
                <button type="submit" class="btn red">Submit Review</button>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <script type="module">
        import { signIn, logout, auth, setAuthListeners } from './auth.js';
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore();
        const container = document.getElementById('amiibo-container');
        const input = document.getElementById('character-input');
        const searchBtn = document.getElementById('search-btn');

        window.selectBook = async function(id, name) {
            document.querySelector('#selectedName').innerHTML = "Reviews for: " + name;
            document.querySelector('#selectedBook').value = id;
            
            const q = query(collection(db, "reviews"), where("isbn", "==", id));
            const querySnapshot = await getDocs(q);
            const list = document.querySelector('#reviewList');
            list.innerHTML = '';
            querySnapshot.forEach((doc) => {
                const li = document.createElement('li');
                li.className = 'collection-item';
                li.textContent = doc.data().text;
                list.appendChild(li);
            });
        };

        async function fetchAmiibo(name) {
            container.innerHTML = 'Loading...';
            try {
                const res = await fetch(`https://www.amiiboapi.com/api/amiibo/?name=${name}`);
                const data = await res.json();
                renderAmiibos(data.amiibo);
            } catch (e) {
                container.innerHTML = 'No results found.';
            }
        }

        function renderAmiibos(list) {
            container.innerHTML = '';
            list.slice(0, 12).forEach(item => {
                const div = document.createElement('div');
                div.className = 'amiibo-card';
                div.innerHTML = `
                    <img src="${item.image}">
                    <h6>${item.name}</h6>
                    <button class="btn-small" onclick="selectBook('${item.tail}', '${item.name}')">Reviews</button>
                `;
                container.appendChild(div);
            });
        }

        document.querySelector('#reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.querySelector('#selectedBook').value;
            const text = document.querySelector('#reviewText').value;

            if (!id) return alert('Select an Amiibo first');
            if (!auth.currentUser) return alert('Login first');

            await addDoc(collection(db, "reviews"), {
                isbn: id,
                text: text,
                uid: auth.currentUser.uid
            });

            M.toast({html: 'Review Saved!'});
            document.querySelector('#reviewText').value = '';
            window.selectBook(id, document.querySelector('#selectedName').innerHTML.replace("Reviews for: ", ""));
        });

        searchBtn.addEventListener('click', () => fetchAmiibo(input.value));
        document.getElementById('loginBtn').addEventListener('click', signIn);
        document.getElementById('logoutBtn').addEventListener('click', logout);

        setAuthListeners(
            (user) => {
                document.getElementById('user').innerText = "Logged In";
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'inline-block';
            },
            () => {
                document.getElementById('user').innerText = "";
                document.getElementById('loginBtn').style.display = 'inline-block';
                document.getElementById('logoutBtn').style.display = 'none';
            }
        );
    </script>
</body>
</html>
